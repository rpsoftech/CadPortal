# Run the published images instead of building on the server:
#
#   CADPORTAL_VERSION=1.2.3 docker compose -f docker-compose.prod.yml -f docker-compose.images.yml up -d
#
# Add --pull always to fetch a moved tag such as latest. Everything else (database,
# environment, hardening) comes from docker-compose.prod.yml; this file only says where the
# application images come from. The images are published by .github/workflows/release.yml.
services:
  api:
    image: ghcr.io/rpsoftech/cadportal-api:${CADPORTAL_VERSION:?set CADPORTAL_VERSION, e.g. 1.2.3}
    pull_policy: always
  web:
    image: ghcr.io/rpsoftech/cadportal-web:${CADPORTAL_VERSION:?set CADPORTAL_VERSION, e.g. 1.2.3}
    pull_policy: always
  backup:
    image: ghcr.io/rpsoftech/cadportal-backup:${CADPORTAL_VERSION:?set CADPORTAL_VERSION, e.g. 1.2.3}
    pull_policy: always
