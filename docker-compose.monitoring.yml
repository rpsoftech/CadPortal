# Monitoring for one server: Grafana with Prometheus (server and container figures) and Loki (the API and web
# logs). It is a separate compose project, so deploying or restarting the portal never touches it, and
# `scripts/deploy.sh` never starts or stops it.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Only Grafana is published, on 127.0.0.1:3000 by default: put the Caddy block from
# deploy/Caddyfile.example in front of it. Everything else stays on the private monitoring network.
name: cadportal-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    logging: *logging
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # The public address (the Caddy site), so links and cookies are right behind the proxy.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    pid: host
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    logging: *logging
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true   # cAdvisor reads cgroups and the Docker data directory; nothing is published

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    logging: *logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Reads the portal's container logs through the Docker socket (read-only mount) and sends them to Loki.
  # Only containers of the project below are collected.
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    logging: *logging
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail.yml -config.expand-env=true
    environment:
      PORTAL_COMPOSE_PROJECT: ${PORTAL_COMPOSE_PROJECT:-cadportal-prod}
    volumes:
      - ./deploy/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/positions
    security_opt: ["no-new-privileges:true"]

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-data:
