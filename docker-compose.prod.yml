# Production-style stack: Postgres + API + web (nginx serving the Angular app and
# proxying /api). Only the web container is published, and by default only on
# localhost: put a TLS-terminating reverse proxy in front of it.
#
#   cp .env.example .env        # then fill in the production section
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Compose reads .env automatically. Required values fail fast with a clear message.
name: cadportal-prod

# Docker keeps container logs forever by default, which eventually fills the disk. Keep 5 files of 10 MB
# per container (about 50 MB), and read them with docker compose logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cad_portal}
    volumes:
      # Postgres 18 keeps data in a versioned subdirectory, so mount one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published ports: only the API can reach the database.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cad}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cad_portal}?sslmode=disable
      AUTO_MIGRATE: "true"
      # One JSON line per request (with a request id that is also in the web log), for log tools. Use text
      # for a terminal. LOG_LEVEL is debug, info, warn or error.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # An outside monitor (Healthchecks.io, Uptime Kuma, ...) is pinged every few minutes while the API can
      # reach its database; when the pings stop, the monitor alerts you. Empty means off.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL_MINUTES: ${HEARTBEAT_INTERVAL_MINUTES:-5}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      # A login lasts at most SESSION_HOURS (1 to 720); the web app signs a user out after
      # IDLE_TIMEOUT_MINUTES (0 to 1440, 0 = never) without activity, with a 60 second warning.
      SESSION_HOURS: ${SESSION_HOURS:-8}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-30}
      # Removed or replaced CAD files, photos and videos are kept this many days and can be restored;
      # 0 deletes them at once.
      DELETED_FILE_RETENTION_DAYS: ${DELETED_FILE_RETENTION_DAYS:-30}
      CAD_ZIP_MAX_FILES: ${CAD_ZIP_MAX_FILES:-1000}
      CAD_ZIP_MAX_MB: ${CAD_ZIP_MAX_MB:-5120}
      # Admins are warned in the setup checklist when no good backup is newer than this many hours
      # (0 = never warn). Left empty it is 36 with R2 and off otherwise.
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
      # "Forgot password" by email. Empty SMTP_HOST means off: people are told to ask an admin for a reset link
      # (Users screen). APP_BASE_URL is the public address, used in the emailed link and in the job-bag QR code.
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # The Backups screen lists and offers the stored dumps with a READ-ONLY token for the backup bucket
      # (not the one the backup service writes with). Leave empty to show run history only.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_VIEW_ACCESS_KEY_ID: ${BACKUP_VIEW_ACCESS_KEY_ID:-}
      BACKUP_VIEW_SECRET_ACCESS_KEY: ${BACKUP_VIEW_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      # Object storage. Production uses Cloudflare R2; STORAGE=local is development only.
      STORAGE: ${STORAGE:-}
      LOCAL_STORAGE_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/data/uploads   # used only when STORAGE=local
    # Hardening: the image already runs as a non-root user with no shell.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s      # the API gives in-flight uploads 30s to finish
    # No published ports: the web container proxies /api to this service.

  # Nightly backups: a database dump (7 daily, 4 weekly, 12 monthly, and one per year kept for good) and a
  # copy of every new CAD file, photo and video, both to a SECOND bucket. Off until you ask for it with
  # COMPOSE_PROFILES=backup in .env (see "Backups" in the README); the portal warns admins while no good
  # backup exists.
  backup:
    profiles: ["backup"]
    build:
      context: ./backend
      target: backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cad}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cad_portal}?sslmode=disable
      # The vault to copy from (the same bucket the API uses).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # The backup bucket: a different bucket, with its own token.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_UNENCRYPTED: ${BACKUP_UNENCRYPTED:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Pinged after every GOOD backup (set the monitor to expect a ping about every 26 hours). Empty means off.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # One time ("02:00") or a list ("02:00,08:00,14:00,20:00"); BACKUP_KEEP_RECENT_HOURS keeps every dump
      # of the last N hours on top of the daily/weekly/monthly ones.
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_TZ: ${BACKUP_TZ:-UTC}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_KEEP_RECENT_HOURS: ${BACKUP_KEEP_RECENT_HOURS:-48}
    volumes:
      - backup-scratch:/scratch   # a dump is written here while it is checked and uploaded
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8080
      # Where photos and video load from (signed links to the object store). Change it only if
      # R2 is reached through a custom domain.
      MEDIA_ORIGINS: ${MEDIA_ORIGINS:-https://*.r2.cloudflarestorage.com}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    # nginx renders its config at start and keeps cache/pid files; everything else is read-only.
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755   # nginx runs as uid 101 in this image
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  backup-scratch:
