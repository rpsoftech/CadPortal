name: CI

# Jobs run only when their inputs changed (see .github/scripts/changes.sh): a docs-only
# change runs nothing, a frontend change runs the frontend job, and so on. Skipped jobs
# report as skipped, which GitHub counts as passing for required status checks, so the
# branch ruleset still works. `changes` itself always runs and is a required check, so a
# broken detector blocks the merge instead of silently skipping everything.
on:
  push:
    branches: [main]
  pull_request:          # not pull_request_target: fork PRs never get secrets
  workflow_dispatch:
  schedule:
    # Weekly, everything: new vulnerability advisories and base-image updates appear
    # without any code change in this repository.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  # The event is part of the key so the weekly run never cancels a push run on main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      test: ${{ steps.decide.outputs.test }}
      sqlc: ${{ steps.decide.outputs.sqlc }}
      frontend: ${{ steps.decide.outputs.frontend }}
      docker: ${{ steps.decide.outputs.docker }}
      vulncheck: ${{ steps.decide.outputs.vulncheck }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the base commit must be present to diff against it
          persist-credentials: false
      - name: Self-test the change detection
        run: bash .github/scripts/changes_test.sh
      - name: Decide which jobs this change needs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: the base branch tip. Push: the commit before the push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/changes.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### Jobs selected for this change"
            echo "| job | runs |"
            echo "|---|---|"
            echo "| test | ${{ steps.decide.outputs.test }} |"
            echo "| sqlc | ${{ steps.decide.outputs.sqlc }} |"
            echo "| frontend | ${{ steps.decide.outputs.frontend }} |"
            echo "| docker | ${{ steps.decide.outputs.docker }} |"
            echo "| vulncheck | ${{ steps.decide.outputs.vulncheck }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cad
          POSTGRES_PASSWORD: cad
          POSTGRES_DB: cad_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cad:cad@localhost:5432/cad_portal_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  sqlc:
    name: sqlc
    needs: changes
    if: needs.changes.outputs.sqlc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Regenerate and check for drift
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- internal/db

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # The runner's yarn delegates to the committed release (yarnPath in .yarnrc.yml),
      # so the pinned Yarn 4 is used without Corepack.
      - name: Install
        run: yarn install --immutable
      - name: Audit (production dependencies)
        run: yarn npm audit --environment production --severity high
      - name: Build
        run: yarn ng build --configuration production
      - name: Unit tests
        run: yarn ng test --watch=false

  # The docker checks are three jobs that run in parallel (each on its own runner, so their ports,
  # containers and compose projects cannot collide), plus `docker`, which reports on all of them.
  # Images are built with buildx and a GitHub Actions layer cache (a cache hit skips the Go and
  # Angular builds), loaded into the runner's Docker, and started with --no-build.
  docker-stack:
    name: docker-stack
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    # Throwaway values for a stack that lives only for this job (nothing here is a secret).
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789ab
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-ab
      WEB_PORT: "18080"
      STORAGE: local          # lets the browser tests upload a CAD file
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the api and web images (layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.prod.yml
          targets: api,web
          load: true
          set: |
            api.tags=cadportal-prod-api
            web.tags=cadportal-prod-web
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max,ignore-error=true
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max,ignore-error=true
      - name: Validate the production compose file
        run: docker compose -f docker-compose.prod.yml config -q
      - name: Validate the published-images override
        run: CADPORTAL_VERSION=0.0.0 docker compose -f docker-compose.prod.yml -f docker-compose.images.yml config -q
      - name: Deploy script (never touches the database, backs up before a version)
        run: scripts/deploy_test.sh
      - name: Lint the workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Start the stack
        # --wait blocks until every service with a health check reports healthy.
        run: docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eu
          base=http://127.0.0.1:${WEB_PORT}
          curl -fsS "$base/healthz"
          curl -fsS "$base/" | grep -q "<app-root"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/designs")" = "401"
          curl -fsSI "$base/" | grep -qi "content-security-policy"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Cache the Yarn packages
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install browser test tooling
        working-directory: frontend
        run: |
          yarn install --immutable
          echo "PLAYWRIGHT_VERSION=$(yarn playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install the browser
        working-directory: frontend
        run: |
          if [ "${{ steps.browser.outputs.cache-hit }}" = "true" ]; then
            yarn playwright install-deps chromium
          else
            yarn playwright install --with-deps chromium
          fi
      - name: Browser smoke tests (data tests, then the accessibility scans in parallel)
        run: scripts/e2e.sh
      - name: Sign-in rate limit
        run: scripts/ratelimit_test.sh
      - name: Keep the browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-a11y
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 80

  docker-backup:
    name: docker-backup
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789ab
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-ab
      STORAGE: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the api and backup images (layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.prod.yml
          targets: api,backup
          load: true
          set: |
            api.tags=cadportal-prod-api
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max,ignore-error=true
            backup.tags=cadportal-backup:test
            backup.cache-from=type=gha,scope=backup
            backup.cache-to=type=gha,scope=backup,mode=max,ignore-error=true
      # The round trip needs the database, and the api running so that the restore stops and restarts it.
      - name: Start the database and the api
        run: docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180 db api
      - name: Backup and restore round trip
        run: scripts/backup_restore_test.sh
      - name: Backup service (nightly dump and file copy to a second bucket)
        run: scripts/backup_service_test.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 80

  docker-multi:
    name: docker-multi
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789ab
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-ab
      CADPORTAL_NO_BUILD: "1"   # the images are built below, with the layer cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the api and web images (layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.prod.yml
          targets: api,web
          load: true
          set: |
            api.tags=cadportal-multi-api
            web.tags=cadportal-multi-web
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max,ignore-error=true
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max,ignore-error=true
      - name: More than one API instance
        run: scripts/multi_instance_test.sh

  # The one status for "the docker checks": it always runs, and it fails when any part failed, was
  # cancelled or was skipped although this change needed it. A change that needs no docker checks
  # passes. Keep requiring this job by its name, `docker`; the parts above need not be listed.
  docker:
    name: docker
    needs: [changes, docker-stack, docker-backup, docker-multi]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    env:
      WANTED: ${{ needs.changes.outputs.docker }}
      RESULTS: ${{ needs.changes.result }} ${{ needs.docker-stack.result }} ${{ needs.docker-backup.result }} ${{ needs.docker-multi.result }}
    steps:
      - name: Check every part
        run: |
          echo "changes stack backup multi: $RESULTS"
          set -- $RESULTS
          [ "$1" = "success" ] || { echo "the change detection did not succeed" >&2; exit 1; }
          if [ "$WANTED" != "true" ]; then echo "no docker checks needed for this change"; exit 0; fi
          shift
          for r in "$@"; do
            [ "$r" = "success" ] || { echo "a docker part did not succeed ($r)" >&2; exit 1; }
          done

  vulncheck:
    name: vulncheck
    needs: changes
    if: needs.changes.outputs.vulncheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
