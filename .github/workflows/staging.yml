name: Staging images

# Every commit that lands on main, once CI has passed on it, is published as the :staging images (and as
# :sha-<commit>, so a build can be pinned or rolled back). The staging server pulls :staging on a timer
# (scripts/deploy.sh staging, see deploy/systemd). Production never uses these tags: it runs only the
# versions published by release.yml from a v1.2.3 tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-images
  cancel-in-progress: true   # a newer main supersedes a build that is still running

jobs:
  images:
    name: ${{ matrix.name }} image
    # CI's weekly scheduled run also reports on main; only a push that passed CI is published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/...
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
          - name: backup
            context: ./backend
            target: backup
    steps:
      - name: Only main is published as staging
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main: staging always follows main."
          exit 1
      - name: Commit to build
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and tags
        id: meta
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          {
            echo "tags<<EOF"
            echo "$image:staging"
            echo "$image:sha-${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}   # empty for api and web: the Dockerfile's last stage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} staging image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
