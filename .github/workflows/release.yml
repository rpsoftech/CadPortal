name: Release

# Publishes the API and web images to GitHub Container Registry when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag must point at a commit that is on main, so only reviewed code is ever published.
# Nothing here runs for pull requests, and nothing is published without a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  guard:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; merge the change first, then tag main."
            exit 1
          fi

  images:
    name: ${{ matrix.name }} image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/...
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
          - name: backup
            context: ./backend
            target: backup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          # v1.2.3 gives 1.2.3 and 1.2; a pre-release (v1.2.3-rc1) gets only its own tag. There is no
          # "latest": production pins an exact version, and :staging belongs to staging.yml.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}   # empty for api and web: the Dockerfile's last stage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
