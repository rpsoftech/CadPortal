# Included in the server block and again in every location that sets its own add_header
# (nginx drops inherited add_header lines in a location that defines any).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The policy is built in default.conf.template ($csp), so the object store that photos and video
# are shown from can be set with MEDIA_ORIGINS.
add_header Content-Security-Policy $csp always;
# Strict-Transport-Security belongs on the TLS-terminating proxy in front of this container.
