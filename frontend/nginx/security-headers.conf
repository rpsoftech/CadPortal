# Included in the server block and again in every location that sets its own add_header
# (nginx drops inherited add_header lines in a location that defines any).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The Angular production build has no inline scripts, so script-src needs no 'unsafe-inline'.
# Angular Material sets inline styles at runtime, hence style-src 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Strict-Transport-Security belongs on the TLS-terminating proxy in front of this container.
