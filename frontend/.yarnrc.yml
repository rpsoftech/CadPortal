approvedGitRepositories:
  - "**"

compressionLevel: 0

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmScopes:
  rps:
    npmAlwaysAuth: false
    npmPublishRegistry: "https://npmjs.rpso.in"
    npmRegistryServer: "https://npmjs.rpso.in"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
